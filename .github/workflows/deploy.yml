name: Deploy Cloudflare production

# Production stays manually gated until the Access, Turnstile, data-reconciliation,
# and DNS acceptance checks in docs/cloudflare-migration.md are complete.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify deployment configuration
        run: |
          if [ -z "$PUBLIC_TURNSTILE_SITE_KEY" ]; then
            echo "Missing production PUBLIC_TURNSTILE_SITE_KEY GitHub environment variable."
            exit 1
          fi
      - name: Verify application and Workers
        run: npm run check:all
      - name: Run migration parity tests
        run: npm test
      - name: Build Workers Assets
        run: npm run build:cloudflare
      - name: Deploy API Worker
        run: npm run deploy:production:api
      - name: Sync public video to R2
        run: npm run sync:r2:production
      - name: Deploy web Worker
        run: npm run deploy:production:web
